# ===== Development profile (default) =====

# H2 database stored in a file (./data/recipedb.mv.db), so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/recipedb
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/recipedb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret: read from the JWT_SECRET environment variable (min. 32 characters).
# If it is not set, a random key is created at startup (no secret is stored in this file).
app.jwt.secret=${JWT_SECRET:}

# Local test accounts created by DataSeeder (dev profile only).
# Passwords can be changed with environment variables.
app.seed.admin-email=admin@recipes.local
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin12345}
app.seed.user-email=user@recipes.local
app.seed.user-password=${SEED_USER_PASSWORD:User12345}
