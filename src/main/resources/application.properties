# ===== Common settings (used by every profile) =====
spring.application.name=recipe-management-api

# The "dev" profile is used when no other profile is chosen
spring.profiles.default=dev

server.port=8080

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Pagination limits
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

# JWT settings (the secret itself is defined per profile / environment variable)
# Access token: 60 minutes, refresh token: 7 days
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000

# CORS: frontend addresses that may call this API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
