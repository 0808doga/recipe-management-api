# ===== Test profile =====
# In-memory database: a fresh, empty database for every test run
spring.datasource.url=jdbc:h2:mem:recipe-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# No JWT secret here: JwtService creates a random key for the test run

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
